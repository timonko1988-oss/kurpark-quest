<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurpark-Spiel Bad Pyrmont</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Layout: ein Spielfeld mittig im Fenster, Anzeige liegt darüber, darunter eine Hinweiszeile. Bewusst nur ein Erscheinungsbild (Parkgrün). */
  :root { --bg: #14291b; --frame: #0a1710; --text: #dcebd2; --key: #f3d77a;
          --panel: #14203ae6; --panel-edge: #f4f1e4; --hud-text: #ffffff; --hud-label: #b9c7e6;
          --pixel-font: "Press Start 2P", ui-monospace, "Courier New", monospace; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; padding-inline: 16px; box-sizing: border-box; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  #stage { position: relative; --s: 1; max-width: 100%; }
  #game { display: block; max-width: 100%; outline: 3px solid var(--frame); }
  /* --s = Vergrößerung des Spielfelds; alle Maße der Anzeige hängen daran */
  #hud { position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start;
         padding: calc(6px * var(--s)); pointer-events: none;
         font: calc(8px * var(--s))/1 var(--pixel-font); color: var(--hud-text); }
  .panel { display: flex; align-items: center; gap: calc(6px * var(--s)); padding: calc(5px * var(--s)) calc(7px * var(--s));
           background: var(--panel); border: calc(1px * var(--s)) solid var(--panel-edge); border-radius: calc(2px * var(--s)); }
  .label { color: var(--hud-label); }
  .icon { width: calc(14px * var(--s)); height: calc(14px * var(--s)); image-rendering: pixelated;
          background-repeat: no-repeat; background-size: auto 100%; background-position: calc(-14px * var(--s) * var(--i)) 0; }
  .icon:not(:first-child) { margin-left: calc(4px * var(--s)); }
  #hint { height: 36px; line-height: 36px; margin: 0; text-align: center; }
  kbd { font: inherit; font-weight: 600; color: var(--key); }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="640" height="360"></canvas>
    <div id="hud">
      <div class="panel"><span class="label">PUNKTE</span><span id="score">0000</span></div>
      <div class="panel" id="legend"></div>
    </div>
  </div>
  <p id="hint"><kbd>Pfeiltasten</kbd> laufen und Schätze einsammeln · <kbd>L</kbd> Laufflächen anzeigen</p>
  <script src="config.js"></script>
  <script src="mapdata.js"></script>
  <script src="game.js"></script>
</body>
</html>
